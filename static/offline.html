<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1230">
  <title>You're offline | Youth Time Revival</title>
  <style>
    :root { color-scheme: light; --night:#1a1230; --ember:#e4572e; --dawn:#f6b93b; --paper:#fbf7f0; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100svh; display:grid; place-items:center; background:var(--night); color:var(--paper); font:17px/1.55 Arial,sans-serif; padding:24px; }
    main { width:min(100%,580px); border:1px solid rgba(246,239,224,.18); background:#241a3d; padding:clamp(28px,7vw,48px); }
    .mark { color:var(--dawn); font:600 1rem Georgia,serif; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:16px 0 12px; font:600 clamp(2rem,8vw,3rem)/1.1 Georgia,serif; }
    p { color:rgba(246,239,224,.82); margin:0 0 22px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; }
    a,button { min-height:44px; display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; padding:10px 18px; color:inherit; font:600 .95rem/1 Arial,sans-serif; text-decoration:none; cursor:pointer; }
    button { background:var(--ember); } a { border-color:rgba(246,239,224,.3); }
    :focus-visible { outline:2px solid var(--dawn); outline-offset:3px; }
  </style>
</head>
<body>
  <main id="main">
    <div class="mark">Youth Time Revival</div>
    <h1>You're offline</h1>
    <p>Some resources you opened before may still be available. Reconnect to access live fellowship, new teachings, videos, audio, and community features.</p>
    <div class="actions"><button type="button" onclick="location.reload()">Try again</button><a href="/">Go home</a></div>
  </main>
</body>
</html>
