<section class="pwa-install-section" id="pwaInstallCard" hidden aria-labelledby="pwaInstallTitle">
  <div class="wrap">
    <div class="pwa-install-card">
      <div>
        <p class="pwa-kicker">Youth Time Revival</p>
        <h2 id="pwaInstallTitle">Take Youth Time Revival with you</h2>
        <p>Install YTR for quick access to daily devotions, articles, teachings, audio, videos, and fellowship.</p>
      </div>
      <div class="pwa-install-actions">
        <button class="btn btn-ember" type="button" id="pwaInstallButton">Install YTR App</button>
        <button class="btn-text" type="button" id="pwaInstallDismiss">Not now</button>
      </div>
    </div>
  </div>
</section>
<aside class="pwa-ios-install" id="pwaIosInstall" hidden aria-labelledby="pwaIosTitle">
  <div><strong id="pwaIosTitle">Install YTR on iPhone</strong><p>Tap Share, choose <strong>Add to Home Screen</strong>, then tap Add.</p></div>
  <button type="button" class="pwa-close" id="pwaIosDismiss" aria-label="Dismiss iPhone installation instructions">&times;</button>
</aside>
<div class="pwa-network-status" id="pwaNetworkStatus" role="status" aria-live="polite" hidden></div>
<aside class="pwa-update" id="pwaUpdate" hidden aria-labelledby="pwaUpdateText"><span id="pwaUpdateText">A new version of YTR is available.</span><button type="button" id="pwaUpdateButton">Update</button></aside>
