{% extends "base.html" %}{% load static %}
{% block content %}<section class="section"><div class="wrap auth-panel" style="max-width:460px"><img class="auth-logo" src="{% static 'branding/ytr-logo-small.png' %}" width="256" height="256" alt="Youth Time Revival"><h1>Choose a new password</h1><div class="form-field" style="margin-top:24px">{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-ember" type="submit">Save password</button></form>{% else %}<p>This reset link has expired. Please request a new one.</p>{% endif %}</div></div></section>{% endblock %}
